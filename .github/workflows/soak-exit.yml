---
name: Soak exit evidence
"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Lint shell fixtures and soak
        run: shellcheck tools/soak.sh ci/test-soak-exit.sh
      - name: Exercise child exits and evidence cleanup
        run: bash ci/test-soak-exit.sh
