---
name: Soak diagnostics
"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n tools/soak.sh ci/test-soak-diagnostics.sh
      - name: Exercise inert diagnostic fixtures
        run: bash ci/test-soak-diagnostics.sh
