name: Fuzzing

# Fast fuzz REGRESSION gate on every PR/push: 120s on the ngx_str_to_char
# target with the SAME breadth flags as ci-deep (fuzz/run.sh: value-profile,
# large max_len, dict, rss ceiling) — only the duration/parallelism differ.
# Self-contained pure C + sanitizers, no libcoraza.
#
# This is a regression gate, not a discovery run. Long fuzz DISCOVERY
# (multi-hour, all cores) lives in ci-deep.yml (monthly cron + workflow_dispatch).

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    # Stacked numbered branches (NN-*) are where all work lives — this fork
    # never merges to main, so CI must trigger on the stack, not just main.
    branches: [main, master, dev, "[0-9][0-9]-*"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: fuzzing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-regression:
    name: Fuzz regression (120s)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    steps:
      - name: Checkout module
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ccache cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-fuzzing-${{ github.sha }}
          restore-keys: |
            ccache-fuzzing-

      - name: Install clang + libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ccache eatmydata
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: Build fuzz target
        run: bash fuzz/build.sh "$GITHUB_WORKSPACE/fuzz/fuzz_str_to_char"

      - name: Run fuzzer (120s regression, deep-parity breadth)
        # Same breadth flags as ci-deep (value-profile, large max_len, dict,
        # rss ceiling) via the shared fuzz/run.sh — only the duration differs.
        # jobs=1 keeps PR wall-clock short; ci-deep fans out across all cores.
        run: bash fuzz/run.sh 120 1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-fast-crashes
          path: ${{ github.workspace }}/fuzz/crash-*
          retention-days: 14
