name: Security Scanners

# Static analysis gate on every PR/push over the coraza connector src/ only:
#   flawfinder  -- blocks at severity >=4. It is a grep for risky APIs and is
#                  noisy below that; gating on every hit would train everyone to
#                  ignore it.
#   clang-tidy  -- blocks on cert-* and clang-analyzer-security.*. These are
#                  path-sensitive and near-zero-FP on code this size.
#   semgrep     -- ADVISORY (|| true). Highest-FP of the three; its value is the
#                  uploaded report a human reads, not a red X. Promote a rule to
#                  blocking deliberately if it earns its keep — do not leave it
#                  advisory forever by default.
#
# clang-tidy needs ngx_auto_config.h, which only exists after configure, so this
# fetches + configures the SAME pinned nginx the build jobs use (via
# versions.env) rather than a "latest mainline" that could drift apart from it.
# It does NOT need to compile nginx or the module — configure is enough to
# produce the generated headers.
#
# Version pins (NGINX_VERSION / NGINX_VERSION_SHA256) come from
# .github/versions.env via load-versions.sh.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master, dev, "[0-9][0-9]-*"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: security-scanners-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scanners:
    name: Security scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout module
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      # Reuse the same built-tree cache key as build-test so a warm run skips the
      # cgo compile and only re-installs the header + .so.
      - name: libcoraza built-tree cache
        id: cache-libcoraza
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/libcoraza-build
          key: libcoraza-built-${{ env.LIBCORAZA_VERSION }}-${{ hashFiles('.github/versions.env') }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ^1.25.x

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flawfinder clang-tidy python3 python3-pip pipx curl \
            build-essential libpcre2-dev zlib1g-dev pkg-config wget
          # semgrep via pipx: PEP 668 blocks a bare `pip3 install` into the
          # system Python on Ubuntu 24.04.
          # PINNED for a reproducible, non-moving supply chain (bump
          # deliberately, same as the nginx pins). Unpinned = a
          # compromised/regressed release runs here silently on the next PR.
          SEMGREP_PIN="semgrep==1.169.0"
          if command -v pipx >/dev/null; then
            pipx install --quiet "$SEMGREP_PIN"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            pip3 install --quiet --user --break-system-packages "$SEMGREP_PIN"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      # Configure only (produces ngx_auto_config.h etc.); no compile needed.
      - name: Fetch + configure nginx (for generated headers)
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" nginx-src.tar.gz
          tar -xzf nginx-src.tar.gz
          cd "nginx-${NGINX_VERSION}"
          ./configure \
            --with-compat --with-debug --with-threads \
            --with-http_ssl_module --with-http_v2_module \
            --add-dynamic-module="$GITHUB_WORKSPACE"

      # clang-tidy must PARSE common.h's `#include "coraza/coraza.h"`. That header
      # is GENERATED by libcoraza's cgo build (go //export), not shipped in the
      # source tree — so we build (or restore from cache) and `make install` it to
      # /usr/local/include/coraza/coraza.h. Same cache key + steps as build-test.
      - name: Build + install libcoraza (for the generated header)
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/libcoraza-build"
          if [ "${{ steps.cache-libcoraza.outputs.cache-hit }}" = "true" ] && [ -f "$DEST/.built" ]; then
            echo "libcoraza built-tree cache hit — installing only, no recompile."
          else
            bash .github/scripts/fetch-verify.sh \
              "https://github.com/corazawaf/libcoraza/archive/refs/tags/${LIBCORAZA_VERSION}.zip" \
              "$LIBCORAZA_SHA256" libcoraza.zip
            rm -rf "$DEST"
            unzip -oq libcoraza.zip
            mv libcoraza-*/ "$DEST"
            cd "$DEST"
            ./build.sh
            ./configure
            make -j"$(nproc)"
            touch "$DEST/.built"
            cd "${{ github.workspace }}"
          fi
          sudo make -C "$DEST" install
          sudo ldconfig

      - name: flawfinder (gate on >=4)
        run: |
          set -euo pipefail
          flawfinder --minlevel=1 "$GITHUB_WORKSPACE/src/" 2>&1 | tee flawfinder.log
          if flawfinder --minlevel=4 --quiet "$GITHUB_WORKSPACE/src/" 2>/dev/null \
               | grep -Eq 'Hits = [1-9]'; then
            echo "flawfinder: high-severity (>=4) findings present" >&2
            exit 1
          fi
          echo "flawfinder: clean at >=4"

      - name: clang-tidy (cert-*, security.*)
        run: |
          set -euo pipefail
          N="$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}"
          INCLUDES="-I$N/src/core -I$N/src/event -I$N/src/event/modules \
            -I$N/src/os/unix -I$N/objs -I$N/src/http -I$N/src/http/modules \
            -I$N/src/http/v2 -I$GITHUB_WORKSPACE/src \
            -I/usr/local/include -I/usr/include"
          status=0
          for src in "$GITHUB_WORKSPACE"/src/*.c; do
            echo "--- clang-tidy: $(basename "$src") ---"
            # DeprecatedOrUnsafeBufferHandling is disabled: it flags every
            # memcpy/sprintf in existence, including nginx's own idioms, and
            # would make the check unusable rather than safer.
            # shellcheck disable=SC2086
            clang-tidy "$src" \
              --checks='-*,cert-*,clang-analyzer-security.*,-clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling' \
              --warnings-as-errors='*' \
              -- $INCLUDES 2>&1 | tee -a clang-tidy.log || status=1
          done
          exit "$status"

      - name: semgrep (advisory)
        run: |
          command -v semgrep >/dev/null || { echo "semgrep missing from PATH" >&2; exit 1; }
          semgrep scan --config p/c --config p/security-audit \
            "$GITHUB_WORKSPACE/src/" 2>&1 | tee semgrep.log || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: |
            ${{ github.workspace }}/flawfinder.log
            ${{ github.workspace }}/clang-tidy.log
            ${{ github.workspace }}/semgrep.log
          retention-days: 14
