# Keep the OSS Scanner image buildable and its offline test run green.
#
# .oss-scanner/Dockerfile is what Anthropic's scanner builds (with network) and then
# analyses (without). Pins drift, apt packages move, nginx-tests changes: if the image
# stops building or the suite stops passing inside it, the scanner mails an error
# instead of findings. This job rebuilds the image on pull requests that touch it, monthly,
# and on demand, then runs the lint and integration suites inside it with networking
# disabled, the way the scanner runs. The monthly run is what catches a bad version bump:
# bump.yml opens its PRs with GITHUB_TOKEN, which does not trigger pull_request workflows.
name: OSS Scanner image

on:
  pull_request:
    # Everything the image build or its in-image runs read.
    paths:
      - ".oss-scanner/**"
      - ".github/workflows/oss-scanner-image.yml"
      - ".github/versions.env"
      - ".github/scripts/fetch-verify.sh"
      - "config"
      - "src/**"
      - "t/**"
      - "lint/**"
      - "fuzz/**"
      - "tests/ftw/**"
      - "tests/ftw-crs.yml"
      - "tools/soak.sh"
  schedule:
    # Monthly, to catch drift that no PR run sees (apt packages, base image, bump.yml PRs).
    - cron: "30 5 2 * *"
  workflow_dispatch: {}

concurrency:
  group: oss-scanner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    name: Build the scanner image and test it offline
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build the image (network on, as the scanner does)
        run: docker build --progress=plain -f .oss-scanner/Dockerfile -t coraza-nginx-scanner .

      # /tmp on tmpfs: coraza-response-body.t uses directio, which overlayfs rejects (EIO).
      - name: Run the suites inside the image with no network
        run: |
          set -o pipefail
          docker run --rm --network none --tmpfs /tmp:exec coraza-nginx-scanner bash -c '
            set -e
            prove lint/*.t
            cd /src/nginx-tests
            timeout --kill-after=30s 15m prove --timer coraza*.t
            /usr/sbin/nginx -t
          ' 2>&1 | tee scanner-image-tests.log

      # The entry points threat_model.md sends the scanner to: serve.sh in both modes,
      # go-ftw against the live server, the ASan soak, and the fuzzers.
      - name: Smoke-test the scanner entry points with no network
        run: |
          set -o pipefail
          docker run --rm --network none --tmpfs /tmp:exec coraza-nginx-scanner bash -c '
            set -e
            . /src/.github/versions.env
            probe() {
              test "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/)" = 200
              test "$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1/?x=<script>alert(1)</script>")" = 403
            }
            /src/.oss-scanner/serve.sh
            probe
            printf "testoverride:\n  input:\n    dest_addr: \"127.0.0.1\"\n    port: 80\n" > /tmp/.ftw.yaml
            go-ftw run --cloud --config /tmp/.ftw.yaml -d /src/tests/ftw/
            /src/.oss-scanner/serve.sh stop
            sleep 1
            /src/.oss-scanner/serve.sh asan
            probe
            /src/.oss-scanner/serve.sh stop
            sleep 1
            bash tools/soak.sh "/src/nginx-asan-${NGINX_VERSION}/objs/nginx" 20 2
            bash fuzz/run.sh 10
            FUZZ_BIN=./fuzz_pack_headers CORPUS_DIR=./corpus_pack_headers bash fuzz/run.sh 10
          ' 2>&1 | tee -a scanner-image-tests.log

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanner-image-tests
          path: scanner-image-tests.log
          if-no-files-found: ignore
