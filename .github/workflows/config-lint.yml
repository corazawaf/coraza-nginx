name: Config lint

# Cheap syntactic/directive gate on every PR/push: build the module (release
# flags), load it, and `nginx -t` the SHIPPED coraza.conf snippet (t/ inline
# configs are exercised by the test suite itself, not linted here).
# Catches directive-name/arg regressions without a full soak.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # NGINX_VERSION / NGINX_VERSION_SHA256 / LIBCORAZA_VERSION come from
  # .github/versions.env, loaded per job via load-versions.sh (first step).

on:
  push:
    branches: [main, master, dev, "[0-9][0-9]-*"]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: config-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config-lint:
    name: Config lint (nginx -t)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Checkout module
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Load version pins
        run: bash .github/scripts/load-versions.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libpcre2-dev zlib1g-dev libssl-dev ccache eatmydata mold
          echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: ccache cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-configlint-${{ github.sha }}
          restore-keys: |
            ccache-configlint-
      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gobuild-configlint-${{ hashFiles('.github/versions.env') }}
          restore-keys: |
            gobuild-configlint-
      - name: nginx source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/nginx-src.tar.gz
          key: nginx-src-${{ hashFiles('.github/versions.env') }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ^1.25.x

      - name: Build libcoraza
        run: |
          set -euo pipefail
          wget -q "https://github.com/corazawaf/libcoraza/archive/refs/tags/${LIBCORAZA_VERSION}.zip"
          unzip -qo "${LIBCORAZA_VERSION}.zip"
          cd libcoraza-*
          ./build.sh && ./configure && eatmydata make && sudo eatmydata make install && sudo ldconfig

      - name: Build module
        run: |
          set -euo pipefail
          bash .github/scripts/fetch-verify.sh \
            "https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz" \
            "$NGINX_VERSION_SHA256" nginx-src.tar.gz
          tar -xzf nginx-src.tar.gz
          cd "nginx-${NGINX_VERSION}"
          ./configure --with-compat --with-http_ssl_module --with-http_v2_module \
            --with-ld-opt="-fuse-ld=mold" \
            --add-dynamic-module="$GITHUB_WORKSPACE" >/dev/null
          eatmydata make -j"$(nproc)" modules
          # the nginx -t lint step below needs the actual binary, not just the .so
          eatmydata make -j"$(nproc)"

      - name: nginx -t the shipped coraza.conf
        run: |
          set -euo pipefail
          NGX="$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/nginx"
          SO="$GITHUB_WORKSPACE/nginx-${NGINX_VERSION}/objs/ngx_http_coraza_module.so"
          PREFIX="$GITHUB_WORKSPACE/_lint"
          mkdir -p "$PREFIX/logs"
          cat > "$PREFIX/nginx.conf" <<EOF
          load_module $SO;
          events { worker_connections 64; }
          error_log $PREFIX/logs/error.log;
          pid $PREFIX/nginx.pid;
          http {
            server {
              listen 8080;
              include $GITHUB_WORKSPACE/coraza.conf;
              location / { return 200; }
            }
          }
          EOF
          "$NGX" -t -p "$PREFIX" -c "$PREFIX/nginx.conf"
